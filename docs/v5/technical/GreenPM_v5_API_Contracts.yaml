          description: Alignment gap raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentGap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /alignment/gaps/{gapId}:
    parameters:
      - name: gapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Organizational Alignment]
      operationId: getAlignmentGap
      summary: Get gap detail
      description: Returns full alignment gap detail with stakeholder acknowledgment status.
      x-engine: Organizational Alignment Engine
      responses:
        '200':
          description: Alignment gap detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentGap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /alignment/gaps/{gapId}/acknowledge:
    parameters:
      - name: gapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Organizational Alignment]
      operationId: acknowledgeAlignmentGap
      summary: Acknowledge alignment gap
      description: Records that the authenticated stakeholder has acknowledged this alignment gap.
      x-engine: Organizational Alignment Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Gap acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentGap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /alignment/gaps/{gapId}/resolve:
    parameters:
      - name: gapId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Organizational Alignment]
