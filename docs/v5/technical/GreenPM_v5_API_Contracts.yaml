          in: query
          schema:
            type: string
            enum: [queued, generating, ready, failed]
      responses:
        '200':
          description: Paginated report list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Reports]
      operationId: createReport
      summary: Create report
      description: Creates a report and triggers async generation. The Reporting Engine compiles structured data sections and invokes the AI Orchestration Engine for narrative sections.
      x-engine: Reporting Engine, AI Orchestration Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report queued for generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reports]
      operationId: getReport
      summary: Get report detail
      description: Returns report detail with structured sections. AI narrative sections are included when status is 'ready'.
      x-engine: Reporting Engine
      responses:
        '200':
          description: Report detail with sections
          content:
            application/json:
              schema:
