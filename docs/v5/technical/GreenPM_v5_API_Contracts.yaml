      operationId: getVendorScore
      summary: Get vendor score with all 6 dimensions
      description: |
        Returns the current Vendor Intelligence Score with a breakdown across all 6 dimensions.

        Dimensions:
        1. Quality (20%): NCRs, defect rates, rework instances
        2. Delivery (25%): On-time delivery rate across all stages
        3. Responsiveness (20%): Average RFI response time, communication quality
        4. Documentation (15%): Drawing quality, completeness, revision frequency
        5. Commercial (10%): Invoice accuracy, claim history, change order pattern
        6. Relationship (10%): Cooperation, escalation resolution, issue ownership
