        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/records:
    get:
      tags: [Organizational Memory]
      operationId: listMemoryRecords
      summary: List memory records
      description: Returns all memory records (individual captured knowledge items) with filtering by type and entity.
      x-engine: Organizational Memory Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: record_type
          in: query
          schema:
            type: string
            enum: [decision_outcome, vendor_performance_history, schedule_recovery, risk_outcome, change_outcome, lesson_learned]
        - name: entity_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Memory records list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemoryRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/records/{recordId}:
    parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Organizational Memory]
      operationId: getMemoryRecord
      summary: Get memory record detail
      description: Returns a specific memory record with full detail.
      x-engine: Organizational Memory Engine
      responses:
        '200':
          description: Memory record detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/search:
    post:
      tags: [Organizational Memory]
      operationId: searchMemory
      summary: Semantic search across memory
      description: Performs semantic search across all patterns and records in the Organizational Memory Engine using vector similarity.
      x-engine: Organizational Memory Engine, AI Orchestration Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 500
                record_type:
                  type: string
                  enum: [decision_outcome, vendor_performance_history, schedule_recovery, risk_outcome, change_outcome, lesson_learned]
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 10
      responses:
        '200':
          description: Semantic search results from memory
          content:
            application/json:
              schema:
                type: object
                properties:
                  patterns:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MemoryPattern'
                        - type: object
                          properties:
                            similarity_score:
                              type: number
                              format: float
                  records:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MemoryRecord'
                        - type: object
                          properties:
                            similarity_score:
                              type: number
                              format: float
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

