                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  duration_seconds:
                    type: integer
                    nullable: true

    SimulationInput:
      type: object
      required: [id, scenario_id, entity_type, entity_id, parameter, original_value, simulated_value]
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        entity_name:
          type: string
        parameter:
          type: string
          example: planned_end
          description: Entity attribute being perturbed
        original_value:
          description: Current project value for this parameter
        simulated_value:
          description: Simulated (what-if) value for this parameter
        perturbation_description:
          type: string
          example: Delayed by 21 days due to early monsoon onset

    SimulationResult:
      type: object
      required: [scenario_id, delta_schedule_days, delta_cost, computed_at]
      properties:
        scenario_id:
          type: string
          format: uuid
        delta_schedule_days:
          type: integer
          description: Change in project completion date in days (positive = delay)
        delta_cost:
          type: number
          format: double
          description: Change in project cost in base currency (positive = increase)
        new_forecast_completion:
          type: string
          format: date
          nullable: true
        critical_path_changes:
          type: array
          items:
            type: object
            properties:
              activity_id:
                type: string
                format: uuid
              activity_name:
                type: string
              change_type:
                type: string
                enum: [added_to_critical_path, removed_from_critical_path, float_reduced, float_increased]
              float_change_days:
                type: integer
        affected_milestones:
          type: array
          items:
            type: object
            properties:
              milestone_id:
                type: string
                format: uuid
              milestone_name:
                type: string
              original_date:
                type: string
                format: date
              simulated_date:
                type: string
                format: date
              variance_days:
                type: integer
        recommendations:
          type: array
          items:
            type: string
          description: Recommended mitigations based on simulation results
        confidence_pct:
          type: number
          format: float
          minimum: 0
          maximum: 100
        computed_at:
          type: string
          format: date-time

    SimulationComparison:
      type: object
      required: [scenario_id, compare_to]
      properties:
        scenario_id:
          type: string
          format: uuid
        scenario_name:
          type: string
        compare_to:
          type: string
          description: '"base_state" or scenario ID being compared against'
        compare_to_name:
          type: string
        delta_schedule_days_vs_base:
          type: integer
          description: Schedule delta of THIS scenario vs base state
        delta_schedule_days_vs_comparison:
          type: integer
          description: Schedule delta of THIS scenario vs comparison scenario
        delta_cost_vs_base:
          type: number
          format: double
        delta_cost_vs_comparison:
          type: number
          format: double
        recommendation:
          type: string
          description: Summary recommendation from the comparison

    CreateSimulationRequest:
      type: object
      required: [project_id, name, inputs]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        scenario_type:
          type: string
          enum: [vendor_delay, monsoon_start, scope_change, additional_crew, resource_reallocation, drawing_delay, regulatory_hold, weather_event, custom]
        inputs:
          type: array
          minItems: 1
          items:
            type: object
            required: [entity_type, entity_id, parameter, simulated_value]
            properties:
              entity_type:
                type: string
              entity_id:
                type: string
                format: uuid
              parameter:
                type: string
              simulated_value:
                description: The perturbed value for the parameter
