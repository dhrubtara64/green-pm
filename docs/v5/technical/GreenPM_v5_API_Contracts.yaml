        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{reportId}/download:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reports]
      operationId: downloadReport
      summary: Download report file
      description: Redirects to a signed GCS URL for the generated PDF. URL is valid for 15 minutes. Only available when report status is 'ready'.
      x-engine: Reporting Engine
      responses:
        '302':
          description: Redirect to signed GCS download URL
          headers:
            Location:
              schema:
                type: string
              description: Signed GCS URL for the report PDF
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Report is not yet ready for download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /reports/{reportId}/generate:
    parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reports]
      operationId: regenerateReport
      summary: Regenerate report
      description: Re-runs AI narrative generation for this report using the latest project data. Useful when significant project events have occurred since initial generation.
      x-engine: Reporting Engine, AI Orchestration Engine
      responses:
        '200':
          description: Report regeneration queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Report is already being generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: AI & Copilot
  # ---------------------------------------------------------------------------

  /ai/query:
    post:
      tags: [AI & Copilot]
      operationId: aiQuery
      summary: Natural language query
      description: |
        Routes a natural language question to the appropriate engines and returns a structured answer
        with an evidence chain. The AI Orchestration Engine determines which engines to invoke based
        on the question content and optional entity context.

        All responses include the evidence chain supporting the answer and the engines invoked.
        The AI layer is never exposed by name in the response — answers are attributed to "Green PM".
      x-engine: AI Orchestration Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, project_id]
              properties:
                question:
                  type: string
                  minLength: 5
                  maxLength: 1000
                  description: Natural language question about the project
                project_id:
                  type: string
                  format: uuid
                context_entity_type:
                  type: string
                  enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
                  description: Optionally scope the question to a specific entity type
                context_entity_id:
                  type: string
                  format: uuid
                  description: Optionally scope the question to a specific entity
      responses:
        '200':
          description: Natural language answer with evidence chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /ai/copilot:
    post:
      tags: [AI & Copilot]
      operationId: aiCopilot
      summary: AI Copilot chat
      description: |
        Sends a message to the AI Copilot ("Ask Green PM"). Maintains conversation context across
        turns using conversation_id. Suggests next actions based on the conversation.

        Note: The AI Copilot UI is branded as "Ask Green PM". The engine identity is never shown.
      x-engine: AI Orchestration Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, project_id]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: User message to the AI Copilot
                project_id:
                  type: string
                  format: uuid
                conversation_id:
                  type: string
                  format: uuid
                  description: Existing conversation ID to continue. Omit to start a new conversation.
                context:
                  type: object
                  additionalProperties: true
                  description: Optional structured context (e.g. current view entity)
      responses:
        '200':
          description: AI Copilot response with suggested actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /ai/copilot/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [AI & Copilot]
      operationId: getCopilotConversation
      summary: Get conversation history
      description: Returns the full message history for an AI Copilot conversation.
      x-engine: AI Orchestration Engine
      responses:
        '200':
          description: Conversation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                    format: uuid
                  project_id:
                    type: string
                    format: uuid
                  created_at:
                    type: string
                    format: date-time
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          enum: [user, assistant]
                        content:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        evidence_chain:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

