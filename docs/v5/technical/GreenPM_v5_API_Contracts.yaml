  /risks:
    get:
      tags: [Risk Engine]
      operationId: listRisks
      summary: List risks
      description: Returns the risk register with Monte Carlo data and current mitigation status.
      x-engine: Risk Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: category
          in: query
          schema:
            type: string
            enum: [schedule, cost, quality, safety, regulatory, technical, vendor, environmental, force_majeure]
        - name: status
          in: query
          schema:
            type: string
            enum: [identified, assessed, mitigating, monitoring, closed, realized]
        - name: probability
          in: query
          schema:
            type: string
            enum: [very_low, low, medium, high, very_high]
          description: Filter by probability rating
        - name: impact
          in: query
          schema:
            type: string
            enum: [negligible, minor, moderate, major, catastrophic]
          description: Filter by impact rating
        - name: is_critical
          in: query
          schema:
            type: boolean
          description: Filter to risks on critical path
