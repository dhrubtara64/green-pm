  # ---------------------------------------------------------------------------
  # Tag: Executive Digital Twin
  # ---------------------------------------------------------------------------

  /digital-twin/current:
    get:
      tags: [Executive Digital Twin]
      operationId: getCurrentEDT
      summary: Get current Executive Digital Twin
      description: Returns the current EDT with all three panels — Reality (current state), Forecast (where it is heading), Required Decisions (what the executive must decide this week). Powered by Forecasting, Recommendation, Decision, and Organizational Memory engines.
      x-engine: Forecasting Engine, Recommendation Engine, Decision Engine, Organizational Memory Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Current Executive Digital Twin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveDigitalTwin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /digital-twin/history:
    get:
      tags: [Executive Digital Twin]
      operationId: getEDTHistory
      summary: Get past EDT snapshots
      description: Returns the last 12 weekly EDT snapshots for trend analysis.
      x-engine: Forecasting Engine, Recommendation Engine, Decision Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: weeks
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 12
      responses:
        '200':
          description: Past EDT snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      type: object
                      properties:
                        week_date:
                          type: string
                          format: date
                        overall_health:
                          type: string
                          enum: [green, amber, red]
                        key_metrics:
                          type: object
                          additionalProperties: true
                        edt_id:
                          type: string
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /digital-twin/{weekDate}:
    parameters:
      - name: weekDate
        in: path
        required: true
        schema:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        description: Monday date for the target week (YYYY-MM-DD format)
    get:
      tags: [Executive Digital Twin]
      operationId: getEDTByWeek
      summary: Get EDT for specific week
      description: Returns the archived EDT snapshot for a specific week identified by its Monday date.
      x-engine: Forecasting Engine, Recommendation Engine, Decision Engine, Organizational Memory Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: EDT for the specified week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveDigitalTwin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No EDT found for the specified week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Green PM Studio
  # ---------------------------------------------------------------------------

  /studio/builders:
    get:
      tags: [Green PM Studio]
      operationId: listBuilders
      summary: List all 15 builder types
      description: Returns the list of all 15 Studio builder types with brief descriptions.
      responses:
        '200':
          description: Studio builder types list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        builder_type:
                          type: string
                          enum: [evidence_criteria, readiness_gate, simulation_scenario, risk_template, coordination_rule, report_template, dashboard_view, alert_rule, scoring_weight, workflow_gate, vendor_scorecard, wbs_template, dispatch_lifecycle, notification_rule, integration_mapping]
                        display_name:
                          type: string
                        description:
                          type: string
                        engine_affiliation:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /studio/builders/{builderType}:
    parameters:
      - name: builderType
        in: path
        required: true
        schema:
          type: string
          enum: [evidence_criteria, readiness_gate, simulation_scenario, risk_template, coordination_rule, report_template, dashboard_view, alert_rule, scoring_weight, workflow_gate, vendor_scorecard, wbs_template, dispatch_lifecycle, notification_rule, integration_mapping]
    get:
      tags: [Green PM Studio]
      operationId: getBuilderSchema
      summary: Get builder schema definition
      description: Returns the JSON schema for a specific builder type, used by the Studio UI to render the configuration form.
      responses:
        '200':
          description: Builder schema definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  builder_type:
                    type: string
                  display_name:
                    type: string
                  description:
                    type: string
                  schema:
                    type: object
                    description: JSON Schema for this builder's configuration
                    additionalProperties: true
                  example_configuration:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /studio/templates:
    get:
      tags: [Green PM Studio]
      operationId: listStudioTemplates
      summary: List saved templates
      description: Returns all configuration templates saved for this project in Studio.
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: builder_type
          in: query
          schema:
            type: string
          description: Filter by builder type
      responses:
        '200':
          description: Saved templates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudioTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Green PM Studio]
      operationId: saveStudioTemplate
      summary: Save a configuration template
      description: Saves a new configuration template to Studio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudioTemplateRequest'
      responses:
        '201':
          description: Template saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /studio/templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Green PM Studio]
      operationId: getStudioTemplate
      summary: Get template detail
      description: Returns a specific Studio template with its full configuration.
      responses:
        '200':
          description: Template detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Green PM Studio]
      operationId: updateStudioTemplate
      summary: Update template
      description: Updates a Studio template's configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudioTemplateRequest'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Green PM Studio]
      operationId: deleteStudioTemplate
      summary: Delete template
      description: Deletes a Studio template. Applying templates that reference this template will fail after deletion.
      responses:
        '204':
          description: Template deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /studio/templates/{templateId}/validate:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Green PM Studio]
      operationId: validateStudioTemplate
      summary: Validate template against schema
      description: Validates a template configuration against the builder schema without applying it.
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /studio/templates/{templateId}/apply:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Green PM Studio]
      operationId: applyStudioTemplate
      summary: Apply template to project
      description: Applies a validated Studio template to the project. Creates or updates the engine configuration based on the template.
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Template applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  template_id:
                    type: string
                    format: uuid
                  project_id:
                    type: string
                    format: uuid
                  applied_at:
                    type: string
                    format: date-time
                  changes_made:
                    type: array
                    items:
                      type: string
                    description: Human-readable list of configuration changes applied
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Template is invalid and cannot be applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Google Identity JWT with tenant_id claim. Obtain via the Google Identity Platform
        OAuth2 flow. Token must include the following claims:
        - sub: User ID
        - email: User email
        - tenant_id: Green PM tenant identifier
        - exp: Token expiry (max 1 hour)

  parameters:
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project identifier

    ProjectIdQuery:
      name: project_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: Project identifier (required for all project-scoped endpoints)

    ActivityIdParam:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Activity identifier

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

    PerPageParam:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of results per page

    SortByParam:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
      description: Field name to sort results by (field names vary by resource)

    SortDirParam:
      name: sort_dir
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort direction

  responses:
    BadRequest:
      description: Bad request — malformed request body or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Missing required field project_id
            request_id: req_abc123

    Unauthorized:
      description: Unauthorized — invalid or expired JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: JWT is expired
            request_id: req_abc123

    Forbidden:
      description: Forbidden — authenticated user lacks permission for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have access to this project
            request_id: req_abc123

    NotFound:
      description: Not found — resource does not exist or is not visible to the caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Activity not found
            request_id: req_abc123

    ValidationError:
      description: Unprocessable entity — validation failed on one or more fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    InternalError:
      description: Internal server error — unexpected error on the server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
            request_id: req_abc123

  schemas:
    # -------------------------------------------------------------------------
    # Common / Utility Schemas
    # -------------------------------------------------------------------------

    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error message
          example: Activity not found
        request_id:
          type: string
          description: Unique request ID for tracing
          example: req_01HK8AQZMX
        details:
          type: object
          additionalProperties: true
          description: Optional additional error details

    ValidationError:
      type: object
      required: [code, message, request_id, field_errors]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR]
        message:
          type: string
          example: Validation failed on 2 fields
        request_id:
          type: string
        field_errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Dot-notation field path
                example: planned_start
              message:
                type: string
                description: Validation error message
                example: planned_start must be before planned_end
              value:
                description: The value that failed validation
                nullable: true

    PaginatedList:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
              minimum: 1
              example: 1
            per_page:
              type: integer
              minimum: 1
              maximum: 100
              example: 25
            total:
              type: integer
              minimum: 0
              example: 143
            total_pages:
              type: integer
              minimum: 0
              example: 6
            next_cursor:
              type: string
              nullable: true
              description: Cursor for the next page (if cursor-based pagination is used)

    HealthResponse:
      type: object
      required: [status, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        version:
          type: string
          example: 5.0.0
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, unavailable]

    VersionResponse:
      type: object
      required: [version, build_hash, build_date, engines]
      properties:
        version:
          type: string
          example: 5.0.0
        build_hash:
          type: string
          example: a3f9c2d
        build_date:
          type: string
          format: date
        engines:
          type: array
          items:
            type: string
          minItems: 17
          maxItems: 17
          description: All 17 engine names

    # -------------------------------------------------------------------------
    # User Schemas
    # -------------------------------------------------------------------------

    UserSummary:
      type: object
      required: [id, email, display_name, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          example: Priya Sharma
        avatar_url:
          type: string
          format: uri
          nullable: true
        status:
          type: string
          enum: [active, invited, suspended]
        created_at:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            timezone:
              type: string
              example: Asia/Kolkata
            notification_preferences:
              type: object
              properties:
                email:
                  type: boolean
                  default: true
                in_app:
                  type: boolean
                  default: true
                digest_frequency:
                  type: string
                  enum: [real_time, daily, weekly]
                  default: real_time
            project_memberships:
              type: array
              items:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  project_name:
                    type: string
                  role:
                    type: string
                    enum: [admin, project_manager, engineer, reviewer, viewer]
                  joined_at:
                    type: string
                    format: date-time

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        timezone:
          type: string
          description: IANA timezone name
        notification_preferences:
          type: object
          properties:
            email:
              type: boolean
            in_app:
              type: boolean
            digest_frequency:
              type: string
              enum: [real_time, daily, weekly]

    InviteUserRequest:
      type: object
      required: [email, role, project_id]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, project_manager, engineer, reviewer, viewer]
        project_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 500
          description: Optional personalised invitation message

    # -------------------------------------------------------------------------
    # Project Schemas
    # -------------------------------------------------------------------------

    ProjectSummary:
      type: object
      required: [id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Rajkot Solar Plant EPC Phase 2
        code:
          type: string
          example: RSP-EPC-P2
          description: Short project code
        status:
          type: string
          enum: [active, archived, on_hold]
        overall_health:
          type: string
          enum: [green, amber, red]
          nullable: true
        progress_pct:
          type: number
          format: float
          minimum: 0
          maximum: 100
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          properties:
            description:
              type: string
              maxLength: 2000
            tenant_id:
              type: string
              format: uuid
            owner_id:
              type: string
              format: uuid
            client_name:
              type: string
              example: Rajkot Municipal Corporation
            contract_value:
              type: number
              format: double
              description: Contract value in project currency
            currency:
              type: string
              example: INR
            baseline_start:
              type: string
              format: date
            baseline_end:
              type: string
              format: date
            forecast_end:
              type: string
              format: date
              nullable: true
            location:
              type: object
              properties:
                name:
                  type: string
                  example: Rajkot, Gujarat, India
                lat:
                  type: number
                  format: double
                lng:
                  type: number
                  format: double
                timezone:
                  type: string
                  example: Asia/Kolkata
            team:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  display_name:
                    type: string
                  role:
                    type: string
            engine_config:
              type: object
              description: Per-engine configuration overrides
              additionalProperties: true
            meta:
              type: object
              additionalProperties: true
              description: Project-level metadata (EPC phase, sector, etc.)
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    CreateProjectRequest:
      type: object
      required: [name, baseline_start, baseline_end]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 200
        code:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 2000
        client_name:
          type: string
        contract_value:
          type: number
          format: double
        currency:
          type: string
          default: USD
          example: INR
        baseline_start:
          type: string
          format: date
        baseline_end:
          type: string
          format: date
        location:
          type: object
          properties:
            name:
              type: string
            lat:
              type: number
              format: double
