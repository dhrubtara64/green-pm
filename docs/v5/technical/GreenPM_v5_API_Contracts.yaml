openapi: 3.0.3
info:
  title: Green PM API
  description: |
    Engineering Project Intelligence Platform — v5 API.

    Green PM continuously transforms every project event into synchronized project
    intelligence and actionable decisions. This specification covers all 17 engines,
    the Project Intelligence Graph (PIG) Query Service, and Green PM Studio.

    ## Engines
    1. Evidence Engine
    2. Impact Analysis Engine
    3. Dependency & Chain Analysis Engine
    4. Organizational Alignment Engine
    5. Synchronization & Consistency Engine
    6. Vendor Intelligence Engine
    7. Supply Chain Intelligence Engine
    8. Risk Engine
    9. Forecasting Engine
    10. Recommendation Engine
    11. Decision Engine
    12. Reporting Engine
    13. AI Orchestration Engine
    14. Readiness Engine
    15. Simulation Engine
    16. Coordination Engine
    17. Organizational Memory Engine

    ## Authentication
    All endpoints require a valid Google Identity JWT containing a `tenant_id` claim.
    Pass the token as `Authorization: Bearer <token>`.

    ## Pagination
    List endpoints use cursor-based or offset pagination. Default page size is 25; maximum is 100.
    Responses include a `pagination` object with `page`, `per_page`, `total`, `total_pages`, and `next_cursor`.

    ## Versioning
    This is v5 of the Green PM API. All paths are prefixed with `/v5`.
  version: 5.0.0
  contact:
    name: Green PM Engineering
    email: engineering@greenfliq.internal
  x-build-date: '2026-08-03'

servers:
  - url: https://api.greenpm.greenfliq.internal/v5
    description: Production
  - url: https://staging-api.greenpm.greenfliq.internal/v5
    description: Staging
  - url: http://localhost:8080/v5
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Platform
    description: Health, versioning, and project management
  - name: Users
    description: User management and profiles
  - name: WBS & Activities
    description: Work Breakdown Structure, activities, milestones, and dependencies
  - name: Evidence Engine
    description: Evidence ingestion, scoring, review, and audit chain
    x-engine: Evidence Engine
  - name: Project Intelligence Graph
    description: PIG entity nodes, edges, traversal, and graph statistics
    x-engine: Impact Analysis Engine
  - name: Drawings & Documents
    description: Drawing register, revisions, RFIs, and document management
  - name: Change Intelligence
    description: Change initiation, impact assessment, and approval workflow
    x-engine: Impact Analysis Engine
  - name: Equipment
    description: Equipment register, inspection scheduling, and status tracking
  - name: Supply Chain
    description: Dispatch lifecycle, purchase orders, material packages, and shipments
    x-engine: Supply Chain Intelligence Engine
  - name: Vendor Intelligence
    description: Vendor scoring, performance attribution, and intelligence
    x-engine: Vendor Intelligence Engine
  - name: Risk Engine
    description: Risk register, Monte Carlo assessment, and mitigation tracking
    x-engine: Risk Engine
  - name: Decision Engine
    description: Decision capture, approval workflow, and institutional learning
    x-engine: Decision Engine
  - name: Readiness Engine
    description: Six readiness gates, criteria, blocking items, and gate history
    x-engine: Readiness Engine
  - name: Simulation Engine
    description: What-if scenario modeling, runs, results, and comparisons
    x-engine: Simulation Engine
  - name: Coordination Engine
    description: Coordination items, acknowledgment, verification, and closure
    x-engine: Coordination Engine
  - name: Organizational Memory
    description: Institutional patterns, memory records, and decision history
    x-engine: Organizational Memory Engine
  - name: Forecasting Engine
    description: Schedule, budget, quality, resource, commissioning, and cash flow forecasts
    x-engine: Forecasting Engine
  - name: Organizational Alignment
    description: Alignment gap detection, stakeholder acknowledgment, and distribution
    x-engine: Organizational Alignment Engine
  - name: Consistency
    description: Contradiction detection and resolution
    x-engine: Synchronization & Consistency Engine
  - name: Recommendations
    description: Ranked recommendations synthesized from all engines
    x-engine: Recommendation Engine
  - name: Reports
    description: Report generation, AI narrative sections, and downloads
    x-engine: Reporting Engine
  - name: AI & Copilot
    description: Natural-language queries and AI Copilot conversation
    x-engine: AI Orchestration Engine
  - name: Entity Workspaces
    description: Aggregated workspace views for all 10 entity types
  - name: Executive Digital Twin
    description: Weekly EDT snapshots with Reality, Forecast, and Required Decisions panels
  - name: Green PM Studio
    description: Builder schemas, configuration templates, and template application

paths:

  # ---------------------------------------------------------------------------
  # Tag: Platform
  # ---------------------------------------------------------------------------

  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Health check
      description: Returns platform health status. Used by load balancers and monitoring systems.
      security: []
      responses:
        '200':
          description: Platform is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 5.0.0
                timestamp: '2026-08-03T08:00:00Z'
                services:
                  database: ok
                  pub_sub: ok
                  vertex_ai: ok

  /version:
    get:
      tags: [Platform]
      operationId: getVersion
      summary: Platform version
      description: Returns detailed version information including build hash and all 17 engine names.
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              example:
                version: 5.0.0
                build_hash: a3f9c2d
                build_date: '2026-08-03'
                engines:
                  - Evidence Engine
                  - Impact Analysis Engine
                  - Dependency & Chain Analysis Engine
                  - Organizational Alignment Engine
                  - Synchronization & Consistency Engine
                  - Vendor Intelligence Engine
                  - Supply Chain Intelligence Engine
                  - Risk Engine
                  - Forecasting Engine
                  - Recommendation Engine
                  - Decision Engine
                  - Reporting Engine
                  - AI Orchestration Engine
                  - Readiness Engine
                  - Simulation Engine
                  - Coordination Engine
                  - Organizational Memory Engine

  /projects:
    get:
      tags: [Platform]
      operationId: listProjects
      summary: List projects
      description: Returns a paginated list of projects the authenticated user has access to.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, on_hold]
          description: Filter by project status
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search across project name and description
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Platform]
      operationId: createProject
      summary: Create project
      description: Creates a new project under the authenticated tenant. Initialises PIG, all 17 engine contexts, and six readiness gates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [Platform]
      operationId: getProject
      summary: Get project detail
      description: Returns full project detail including metadata, team, and engine configuration.
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Platform]
      operationId: updateProject
      summary: Update project
      description: Updates project metadata. Only project admins can change engine configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{projectId}/summary:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags: [Platform]
      operationId: getProjectSummary
      summary: Executive Digital Twin current state
      description: Returns the current Executive Digital Twin summary — Reality, Forecast, and Required Decisions panels. This is the entry point for the Project Command Centre.
      x-engine: Forecasting Engine, Recommendation Engine, Decision Engine, Organizational Memory Engine
      responses:
        '200':
          description: Executive Digital Twin current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveDigitalTwin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Users
  # ---------------------------------------------------------------------------

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get current user profile
      description: Returns the authenticated user's profile, role assignments, and project memberships.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update profile
      description: Updates the authenticated user's display name, notification preferences, and timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (admin only)
      description: Returns a paginated list of all users in the tenant. Requires admin role.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, project_manager, engineer, reviewer, viewer]
          description: Filter by role
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite user
      description: Sends an invitation to a new user and assigns them a role. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Invitation sent; user created in pending state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: User identifier
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user detail
      description: Returns a specific user's profile and project memberships.
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: User identifier
    put:
      tags: [Users]
      operationId: changeUserRole
      summary: Change user role
      description: Updates the role of a user on a specific project. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, role]
              properties:
                project_id:
                  type: string
                  format: uuid
                  description: Project to assign role in
                role:
                  type: string
                  enum: [admin, project_manager, engineer, reviewer, viewer]
                  description: New role assignment
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: WBS & Activities
  # ---------------------------------------------------------------------------

  /activities:
    get:
      tags: [WBS & Activities]
      operationId: listActivities
      summary: List activities
      description: Returns a paginated list of activities. Supports filtering by project, status, WBS element, and critical path flag. Results include the current evidence score for each activity.
      x-engine: Dependency & Chain Analysis Engine, Evidence Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, in_progress, complete, on_hold, cancelled]
          description: Filter by activity status
        - name: is_critical
          in: query
          schema:
            type: boolean
          description: Filter to critical path activities only
        - name: wbs_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter activities under a specific WBS element
        - name: discipline
          in: query
          schema:
            type: string
          description: Filter by engineering discipline (e.g. Civil, Mechanical, Electrical)
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortDirParam'
      responses:
        '200':
          description: Paginated list of activities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActivitySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [WBS & Activities]
      operationId: createActivity
      summary: Create activity
      description: Creates a new activity under a WBS element. Activity is registered as a node in the Project Intelligence Graph.
      x-engine: Dependency & Chain Analysis Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
    get:
      tags: [WBS & Activities]
      operationId: getActivity
      summary: Get activity detail
      description: Returns full activity detail including schedule dates, float, evidence score with component breakdown, and current PIG connections.
      x-engine: Dependency & Chain Analysis Engine, Evidence Engine
      responses:
        '200':
          description: Full activity detail with evidence score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityWithScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [WBS & Activities]
      operationId: updateActivity
      summary: Update activity
      description: Updates activity metadata, dates, and status. Date changes trigger Impact Analysis Engine to assess cascading effects.
      x-engine: Dependency & Chain Analysis Engine, Impact Analysis Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
    get:
      tags: [WBS & Activities]
      operationId: getActivityDependencies
      summary: Get activity dependencies
      description: Returns the full predecessor and successor list for this activity with relationship types (FS, SS, FF, SF), lag/lead values, and float.
      x-engine: Dependency & Chain Analysis Engine
      responses:
        '200':
          description: Predecessor and successor dependency list
          content:
            application/json:
              schema:
                type: object
                properties:
                  predecessors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dependency'
                  successors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dependency'
                  total_float_days:
                    type: number
                    format: float
                    description: Total float for this activity in working days
                  free_float_days:
                    type: number
                    format: float
                    description: Free float for this activity in working days
                  is_critical:
                    type: boolean
                    description: Whether this activity is on the critical path
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [WBS & Activities]
      operationId: addDependency
      summary: Add dependency
      description: Adds a predecessor or successor dependency link. Validates for circular dependencies before committing. Writes DEPENDS_ON or PRECEDED_BY edge to PIG.
      x-engine: Dependency & Chain Analysis Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDependencyRequest'
      responses:
        '201':
          description: Dependency added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependency'
        '400':
          description: Bad request or circular dependency detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}/dependencies/{dependencyId}:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
      - name: dependencyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Dependency identifier
    delete:
      tags: [WBS & Activities]
      operationId: deleteDependency
      summary: Delete dependency
      description: Removes a dependency link. Recalculates critical path after removal.
      x-engine: Dependency & Chain Analysis Engine
      responses:
        '204':
          description: Dependency removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}/evidence:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
    get:
      tags: [WBS & Activities]
      operationId: getActivityEvidence
      summary: Get activity evidence
      description: Returns all evidence items linked to this activity, ordered by capture date descending.
      x-engine: Evidence Engine
      responses:
        '200':
          description: Evidence list for activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Evidence'
                  evidence_score:
                    $ref: '#/components/schemas/EvidenceScore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}/risks:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
    get:
      tags: [WBS & Activities]
      operationId: getActivityRisks
      summary: Get linked risks
      description: Returns all risks linked to this activity via the PIG RAISES_RISK_TO edge.
      x-engine: Risk Engine
      responses:
        '200':
          description: Risks linked to this activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /activities/{activityId}/coordination:
    parameters:
      - $ref: '#/components/parameters/ActivityIdParam'
    get:
      tags: [WBS & Activities]
      operationId: getActivityCoordination
      summary: Get coordination items for activity
      description: Returns all open and recently closed coordination items where this activity is the subject.
      x-engine: Coordination Engine
      responses:
        '200':
          description: Coordination items for this activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoordinationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /wbs:
    get:
      tags: [WBS & Activities]
      operationId: getWBSTree
      summary: Get WBS tree structure
      description: Returns the full WBS hierarchy as a nested tree with rollup data (progress %, cost, risk exposure) at each level.
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
