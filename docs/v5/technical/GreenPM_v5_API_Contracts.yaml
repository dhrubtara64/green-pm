  /reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List reports
      description: Returns a paginated list of generated reports with download availability.
      x-engine: Reporting Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: report_type
          in: query
          schema:
            type: string
            enum: [weekly_status, monthly_progress, executive_summary, milestone_readiness, risk_register, vendor_performance, change_log, commissioning_readiness, custom]
