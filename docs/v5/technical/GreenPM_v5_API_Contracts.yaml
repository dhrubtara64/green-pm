                      type: object
                      properties:
                        from_state:
                          type: string
                        to_state:
                          type: string
                        actor_id:
                          type: string
                          format: uuid
                        actor_name:
                          type: string
                        occurred_at:
                          type: string
                          format: date-time
                        notes:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/analytics:
    get:
      tags: [Coordination Engine]
      operationId: getCoordinationAnalytics
      summary: Coordination analytics
      description: Returns analytics on coordination item performance including average time to close by event type, closure rate, and overdue count.
      x-engine: Coordination Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: period_days
