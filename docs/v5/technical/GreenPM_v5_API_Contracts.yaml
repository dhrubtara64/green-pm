          type: number
          format: double
          nullable: true
        location_lng:
          type: number
          format: double
          nullable: true
        quality_rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        reliability_weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EvidenceDetail:
      allOf:
        - $ref: '#/components/schemas/Evidence'
        - type: object
          properties:
            download_url:
              type: string
              format: uri
              nullable: true
              description: Signed GCS download URL (valid 15 minutes)
            transcript:
              type: string
              nullable: true
              description: Auto-transcribed text (for voice notes)
            review_history:
              type: array
              items:
                type: object
                properties:
                  reviewer_id:
                    type: string
                    format: uuid
                  reviewer_name:
                    type: string
                  action:
                    type: string
                    enum: [reviewed, approved, rejected]
                  quality_rating:
                    type: integer
                    nullable: true
                  notes:
                    type: string
                    nullable: true
                  flags:
                    type: array
                    items:
                      type: string
                  actioned_at:
                    type: string
                    format: date-time

    EvidenceScore:
      type: object
      required: [entity_type, entity_id, score, computed_at]
      properties:
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Evidence Score v5 (0.0 = no evidence, 1.0 = perfectly evidenced)
          example: 0.74
        source_count:
          type: integer
          description: Number of approved evidence items
        computed_at:
          type: string
          format: date-time

    EvidenceScoreDetail:
      allOf:
        - $ref: '#/components/schemas/EvidenceScore'
        - type: object
          properties:
            components:
              $ref: '#/components/schemas/EvidenceScoreComponents'
            score_history:
              type: array
              description: Last 12 weekly score values
              items:
                type: object
                properties:
                  week_ending:
                    type: string
                    format: date
                  score:
                    type: number
                    format: float

    EvidenceScoreComponents:
      type: object
      description: |
        Breakdown of Evidence Score v5 components.
        Formula: (source_count_component × 0.25) + (recency_decay_component × 0.25) +
                 (corroboration_ratio_component × 0.25) + (capture_diversity_component × 0.15) +
                 (reliability_weight_avg_component × 0.10)
      properties:
        source_count_component:
          type: number
          format: float
          minimum: 0
          maximum: 0.25
          description: Contribution from source count (source_count / 10 × 0.25, capped at 0.25)
        recency_decay_component:
          type: number
          format: float
          minimum: 0
          maximum: 0.25
          description: Contribution from recency decay (exponential decay based on days since last evidence)
        corroboration_ratio_component:
          type: number
          format: float
          minimum: 0
          maximum: 0.25
          description: Contribution from corroboration ratio (claims supported by 2+ sources)
        capture_diversity_component:
          type: number
          format: float
          minimum: 0
          maximum: 0.15
          description: Contribution from variety of capture types used
        reliability_weight_avg_component:
          type: number
          format: float
          minimum: 0
          maximum: 0.10
          description: Contribution from average reliability weight of approved sources
        source_count:
          type: integer
          description: Raw count of approved evidence sources
        days_since_last_evidence:
          type: integer
          nullable: true
        corroboration_ratio:
          type: number
          format: float
          minimum: 0
          maximum: 1
        capture_types_used:
          type: array
          items:
            type: string
        reliability_weight_avg:
          type: number
          format: float
          minimum: 0
          maximum: 1

