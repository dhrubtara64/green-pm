          format: float
          minimum: 0
          maximum: 1
          description: Edge weight (1.0 = fully active relationship, 0 = expired/inactive)
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

