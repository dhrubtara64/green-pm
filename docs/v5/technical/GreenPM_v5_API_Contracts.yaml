          format: uuid
    get:
      tags: [Entity Workspaces]
      operationId: getWBSWorkspace
      summary: WBS Workspace
      description: Returns the complete WBS Workspace with all activities, progress rollup, evidence score rollup, cost rollup, resource loading, risk exposure, and readiness status.
      x-engine: Dependency & Chain Analysis Engine, Evidence Engine, Forecasting Engine, Risk Engine, Readiness Engine
      responses:
        '200':
          description: WBS Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WBSWorkspace'
        '401':
