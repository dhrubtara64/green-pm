      description: Returns recommendations synthesized from all 17 engines ranked by priority. Recommendations are always backed by an evidence chain and include a projected outcome.
      x-engine: Recommendation Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: priority
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
          description: Filter recommendations about a specific entity type
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, in_progress, acted_on, dismissed, expired]
        - name: engine
          in: query
          schema:
            type: string
          description: Filter recommendations originating from a specific engine
      responses:
        '200':
          description: Ranked recommendations list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
