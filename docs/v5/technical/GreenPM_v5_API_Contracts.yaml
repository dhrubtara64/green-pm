          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Decision has no options or is in wrong state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /decisions/{decisionId}/approve:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Decision Engine]
      operationId: approveDecision
      summary: Approve decision and choose option
      description: Approves this decision and selects the chosen option. Writes the decision outcome to Organizational Memory Engine for institutional learning.
      x-engine: Decision Engine, Organizational Memory Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chosen_option_id]
              properties:
                chosen_option_id:
                  type: string
                  format: uuid
                  description: ID of the selected option
                rationale:
                  type: string
                  maxLength: 1000
                  description: Rationale for choosing this option
      responses:
        '200':
          description: Decision approved with chosen option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Decision is not pending this user's approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /decisions/{decisionId}/reject:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Decision Engine]
      operationId: rejectDecision
      summary: Reject decision
      description: Rejects this decision and returns it to the decision owner with feedback.
      x-engine: Decision Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Decision rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /decisions/{decisionId}/institutional-matches:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Decision Engine]
      operationId: getInstitutionalMatches
      summary: Get similar past decisions
      description: |
        Returns historical decisions from the Organizational Memory Engine that are similar
        to this one. Similarity is computed using vector embedding of decision descriptions.
        Each match includes the outcome selected and the measured result.
      x-engine: Decision Engine, Organizational Memory Engine
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Similar past decisions from institutional memory
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstitutionalMatch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Readiness Engine (NEW in v5)
  # ---------------------------------------------------------------------------

  /readiness:
    get:
      tags: [Readiness Engine]
      operationId: getReadinessSummary
      summary: Get all 6 gates summary
      description: Returns a summary of all six readiness gates for the project with completion percentage and blocking item count per gate.
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Six-gate readiness summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  overall_readiness_pct:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 100
                    description: Weighted average readiness across all 6 gates
                  gates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadinessGateSummary'
                  computed_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{gateType}:
    parameters:
      - name: gateType
        in: path
        required: true
        schema:
          type: string
          enum: [engineering, material, construction, quality, commissioning, cod]
        description: "Readiness gate type: engineering=IFC drawings & specs, material=on-site & inspected, construction=prerequisites & permits, quality=QA/QC protocols, commissioning=systems complete & punch lists, cod=handover docs & regulatory clearances"
    get:
      tags: [Readiness Engine]
      operationId: getReadinessGate
      summary: Get gate detail
      description: Returns the full detail of a readiness gate including all criteria, blocking items, and responsible parties.
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Readiness gate detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessGate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{gateType}/evaluate:
    parameters:
      - name: gateType
        in: path
        required: true
        schema:
          type: string
          enum: [engineering, material, construction, quality, commissioning, cod]
    put:
      tags: [Readiness Engine]
      operationId: evaluateReadinessGate
      summary: Trigger manual gate re-evaluation
      description: Triggers the Readiness Engine to re-evaluate all criteria for this gate against current project data. Useful after bulk data updates.
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Gate re-evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessGate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{gateType}/blocking-items:
    parameters:
      - name: gateType
        in: path
        required: true
        schema:
          type: string
          enum: [engineering, material, construction, quality, commissioning, cod]
    get:
      tags: [Readiness Engine]
      operationId: getReadinessBlockingItems
      summary: Get blocking items for gate
      description: Returns all criteria that are blocking this gate from passing, with owner and due date for each.
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Blocking items for this gate
          content:
            application/json:
              schema:
                type: object
                properties:
                  gate_type:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        criteria_id:
                          type: string
                          format: uuid
                        description:
                          type: string
                        owner_id:
                          type: string
                          format: uuid
                        owner_name:
                          type: string
                        due_date:
                          type: string
                          format: date
                        days_overdue:
                          type: integer
                          description: Positive if past due date, negative if still ahead
                        linked_entity_type:
                          type: string
                        linked_entity_id:
                          type: string
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{gateType}/criteria:
    parameters:
      - name: gateType
        in: path
        required: true
        schema:
          type: string
          enum: [engineering, material, construction, quality, commissioning, cod]
    post:
      tags: [Readiness Engine]
      operationId: addReadinessCriteria
      summary: Add criteria to gate
      description: Adds a new criterion to this readiness gate. Criteria can be manual (checked by a person) or automatic (evaluated by engine against entity data).
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReadinessCriteriaRequest'
      responses:
        '201':
          description: Criteria added to gate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessCriteria'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/{gateType}/criteria/{criteriaId}:
    parameters:
      - name: gateType
        in: path
        required: true
        schema:
          type: string
          enum: [engineering, material, construction, quality, commissioning, cod]
      - name: criteriaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Readiness Engine]
      operationId: updateReadinessCriteria
      summary: Mark criterion as passed/failed/waived
      description: Updates the status of a readiness criterion. Waiving requires a mandatory justification. Triggers gate score recalculation.
      x-engine: Readiness Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [not_started, in_progress, passed, failed, waived, na]
                verified_by:
                  type: string
                  format: uuid
                  description: User ID of the person verifying this criterion
                notes:
                  type: string
                  maxLength: 500
                waiver_justification:
                  type: string
                  maxLength: 1000
                  description: Required if status is 'waived'
                evidence_id:
                  type: string
                  format: uuid
                  description: Optional evidence supporting this status update
      responses:
        '200':
          description: Criteria status updated; gate score recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessCriteria'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /readiness/history:
    get:
      tags: [Readiness Engine]
      operationId: getReadinessHistory
      summary: Get readiness gate score history
      description: Returns weekly readiness score history for all 6 gates for trend charts.
      x-engine: Readiness Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: weeks
          in: query
          schema:
            type: integer
            minimum: 4
            maximum: 52
            default: 12
      responses:
        '200':
          description: Readiness gate score history
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        week_ending:
                          type: string
                          format: date
                        gates:
                          type: object
                          additionalProperties:
                            type: number
                            format: float
                          description: Gate type → completion_pct for this week
                        overall_pct:
                          type: number
                          format: float
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Simulation Engine (NEW in v5)
  # ---------------------------------------------------------------------------

  /simulations:
    get:
      tags: [Simulation Engine]
      operationId: listSimulations
      summary: List simulation scenarios
      description: Returns a list of what-if scenarios created for this project with status and last run summary.
      x-engine: Simulation Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, queued, running, completed, failed, archived]
      responses:
        '200':
          description: List of simulation scenarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SimulationScenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Simulation Engine]
      operationId: createSimulation
      summary: Create simulation scenario
      description: Creates a new what-if scenario. Inputs define the perturbations to the project model (e.g., "delay drawing X by 3 weeks", "add 10 crew to activity Y").
      x-engine: Simulation Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSimulationRequest'
      responses:
        '201':
          description: Simulation scenario created in draft state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationScenario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /simulations/{scenarioId}:
    parameters:
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Simulation Engine]
      operationId: getSimulation
      summary: Get scenario detail
      description: Returns full scenario detail including all inputs and the current run status.
      x-engine: Simulation Engine
      responses:
        '200':
          description: Simulation scenario detail with status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationScenarioDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Simulation Engine]
      operationId: archiveSimulation
      summary: Archive scenario
      description: Archives a simulation scenario. Archived scenarios are excluded from default list views but are retained for audit.
      x-engine: Simulation Engine
      responses:
        '204':
          description: Scenario archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /simulations/{scenarioId}/run:
    parameters:
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Simulation Engine]
      operationId: runSimulation
      summary: Trigger simulation run
      description: Triggers the Simulation Engine to run this scenario asynchronously. Returns a job_id for status polling. Typical run time is 30-120 seconds depending on project size.
      x-engine: Simulation Engine
      responses:
        '200':
          description: Simulation run triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  scenario_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, running]
                  estimated_seconds:
                    type: integer
                    description: Estimated run time in seconds
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Simulation is already running or has no inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /simulations/{scenarioId}/results:
    parameters:
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Simulation Engine]
      operationId: getSimulationResults
      summary: Get simulation results
      description: Returns the completed simulation results including schedule delta, cost delta, critical path changes, and recommended mitigations.
      x-engine: Simulation Engine
      responses:
        '200':
          description: Simulation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Simulation has not completed yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /simulations/{scenarioId}/compare:
    parameters:
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Simulation Engine]
      operationId: compareSimulation
      summary: Compare with base or another scenario
      description: Compares this scenario's results against the project base state or another scenario.
      x-engine: Simulation Engine
      parameters:
        - name: compare_to_id
          in: query
          schema:
            type: string
            format: uuid
          description: Scenario ID to compare against. If omitted, compares against project base state.
      responses:
        '200':
          description: Simulation comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationComparison'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One or both scenarios have not completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /simulations/templates:
    get:
      tags: [Simulation Engine]
      operationId: listSimulationTemplates
      summary: List simulation templates
      description: Returns pre-defined scenario templates from Green PM Studio. Templates cover common EPC scenarios such as vendor delay, monsoon impact, scope change, and resource reallocation.
      x-engine: Simulation Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: List of simulation scenario templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        template_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                          example: Vendor Delay Impact
                        description:
                          type: string
                        scenario_type:
                          type: string
                          enum: [vendor_delay, monsoon_start, scope_change, additional_crew, resource_reallocation, drawing_delay, regulatory_hold, weather_event]
                        default_inputs:
                          type: array
                          items:
                            $ref: '#/components/schemas/SimulationInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Coordination Engine (NEW in v5)
  # ---------------------------------------------------------------------------

  /coordination/items:
    get:
      tags: [Coordination Engine]
      operationId: listCoordinationItems
      summary: List coordination items (board view)
      description: Returns coordination items in a board-view format. Every significant project event generates coordination items that must be acknowledged, executed, verified, and closed.
      x-engine: Coordination Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, in_progress, executed, verified, closed, overdue, escalated]
        - name: assigned_to
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by assigned user ID
        - name: due_date_before
          in: query
          schema:
            type: string
            format: date
          description: Filter items due on or before this date
        - name: priority
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: source_event_type
          in: query
          schema:
            type: string
            enum: [change_approved, risk_realized, drawing_issued, milestone_at_risk, vendor_delay, equipment_delay, safety_incident, inspection_failed]
          description: Filter by the event type that generated this coordination item
      responses:
        '200':
          description: Paginated coordination items in board view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CoordinationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Coordination Engine]
      operationId: createCoordinationItem
      summary: Manually create coordination item
      description: Creates a coordination item manually (not triggered by an engine event). Used for project-specific action items.
      x-engine: Coordination Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoordinationItemRequest'
      responses:
        '201':
          description: Coordination item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Coordination Engine]
      operationId: getCoordinationItem
      summary: Get coordination item detail
      description: Returns full coordination item detail with complete timeline of state transitions.
      x-engine: Coordination Engine
      responses:
        '200':
          description: Coordination item detail with timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationItemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/items/{itemId}/acknowledge:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Coordination Engine]
      operationId: acknowledgeCoordinationItem
      summary: Acknowledge coordination item
      description: Records that the assigned user has acknowledged this coordination item. Only the assigned user can acknowledge.
      x-engine: Coordination Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 500
                  description: Acknowledgment notes
                commit_date:
                  type: string
                  format: date
                  description: Date the user commits to completing the action
      responses:
        '200':
          description: Item acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the assigned user can acknowledge this item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Item is not in 'open' state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/items/{itemId}/verify:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Coordination Engine]
      operationId: verifyCoordinationItem
      summary: Verify action taken
      description: Verifies that the action described in this coordination item has been taken. Can optionally link evidence.
      x-engine: Coordination Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidence_id:
                  type: string
                  format: uuid
                  description: Optional evidence item confirming action was taken
                notes:
                  type: string
                  maxLength: 500
                  description: Verification notes
      responses:
        '200':
          description: Action verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Item must be acknowledged before verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/items/{itemId}/close:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Coordination Engine]
      operationId: closeCoordinationItem
      summary: Close coordination item
      description: Closes the coordination item and records the closure type. Closed items contribute to the Coordination Engine analytics.
      x-engine: Coordination Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closure_type]
              properties:
                closure_type:
                  type: string
                  enum: [action_complete, resolved_by_change, no_action_required, superseded, escalated_to_risk]
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Coordination item closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /coordination/items/{itemId}/history:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Coordination Engine]
      operationId: getCoordinationItemHistory
      summary: Get state transition history
      description: Returns the complete state transition history for this coordination item.
      x-engine: Coordination Engine
      responses:
        '200':
          description: State transition history
          content:
            application/json:
              schema:
                type: object
                properties:
                  item_id:
