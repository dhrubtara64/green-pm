  # ---------------------------------------------------------------------------
  # Tag: Evidence Engine
  # ---------------------------------------------------------------------------

  /evidence:
    get:
      tags: [Evidence Engine]
      operationId: listEvidence
      summary: List evidence
      description: Returns a paginated list of evidence items. Supports filtering by entity type, capture type, status, and date range.
      x-engine: Evidence Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
          description: Filter by the type of entity this evidence belongs to
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific entity ID
        - name: capture_type
          in: query
          schema:
            type: string
            enum: [photo, video, site_diary, inspection_report, rfi, ncr, drawing_markup, voice_note, weather_log, material_delivery, daily_progress, test_result]
          description: Filter by evidence capture type
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, under_review, approved, rejected]
          description: Filter by evidence review status
        - name: captured_after
          in: query
          schema:
            type: string
            format: date
          description: Return evidence captured on or after this date
        - name: captured_before
          in: query
          schema:
            type: string
            format: date
          description: Return evidence captured on or before this date
      responses:
        '200':
          description: Paginated list of evidence items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Evidence Engine]
      operationId: submitEvidence
      summary: Submit evidence
      description: |
        Submits a new evidence item. Accepts multipart/form-data with a file attachment and metadata.
        Evidence Score v5 is recalculated for the linked entity upon acceptance.

        Supported capture types and file formats:
        - photo: image/jpeg, image/png, image/heic
        - video: video/mp4, video/quicktime (max 500MB)
        - voice_note: audio/mpeg, audio/wav (auto-transcribed via Cloud Speech-to-Text)
        - All document types: application/pdf (max 100MB)

        The Evidence Engine writes a VERIFIES edge from this evidence to the linked entity in the PIG.
      x-engine: Evidence Engine
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entity_type, entity_id, capture_type, captured_at]
              properties:
                entity_type:
                  type: string
                  enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
                  description: Type of entity this evidence relates to
                entity_id:
                  type: string
                  format: uuid
                  description: ID of the entity this evidence relates to
                capture_type:
                  type: string
                  enum: [photo, video, site_diary, inspection_report, rfi, ncr, drawing_markup, voice_note, weather_log, material_delivery, daily_progress, test_result]
                  description: Evidence capture type
                captured_at:
                  type: string
                  format: date-time
                  description: When the evidence was captured (ISO 8601, must not be in the future)
                captured_by:
                  type: string
                  format: uuid
                  description: User ID of the person who captured the evidence (defaults to authenticated user)
                description:
                  type: string
                  maxLength: 2000
                  description: Free-text description of what the evidence shows
                location_lat:
                  type: number
                  format: double
                  description: GPS latitude where evidence was captured
                location_lng:
                  type: number
                  format: double
                  description: GPS longitude where evidence was captured
                file:
                  type: string
                  format: binary
                  description: The evidence file attachment
      responses:
        '201':
          description: Evidence submitted and queued for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{evidenceId}:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Evidence item identifier
    get:
      tags: [Evidence Engine]
      operationId: getEvidence
      summary: Get evidence detail
      description: Returns full evidence detail including file metadata, review history, and signed download URL (valid 15 minutes).
      x-engine: Evidence Engine
      responses:
        '200':
          description: Evidence detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{evidenceId}/review:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Evidence Engine]
      operationId: submitEvidenceReview
      summary: Submit evidence review
      description: Submits a quality review for an evidence item. Required before approval. Reviewer role required.
      x-engine: Evidence Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quality_rating, notes]
              properties:
                quality_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Quality rating from 1 (poor) to 5 (excellent)
                notes:
                  type: string
                  maxLength: 1000
                  description: Review notes and observations
                flags:
                  type: array
                  items:
                    type: string
                    enum: [blurry, incomplete, wrong_entity, inconsistent_date, suspicious]
                  description: Quality flags raised during review
      responses:
        '200':
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{evidenceId}/approve:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Evidence Engine]
      operationId: approveEvidence
      summary: Approve evidence
      description: Approves evidence after review. Triggers recalculation of Evidence Score v5 for the linked entity. Approver role required.
      x-engine: Evidence Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 500
                  description: Optional approval notes
                reliability_weight:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Reliability weight assigned to this source (default 1.0)
      responses:
        '200':
          description: Evidence approved; evidence score recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Evidence is not in a reviewable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{evidenceId}/reject:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Evidence Engine]
      operationId: rejectEvidence
      summary: Reject evidence
      description: Rejects evidence with a mandatory reason. Rejected evidence does not contribute to the Evidence Score.
      x-engine: Evidence Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  maxLength: 500
                  description: Reason for rejecting this evidence
      responses:
        '200':
          description: Evidence rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/scores:
    get:
      tags: [Evidence Engine]
      operationId: listEvidenceScores
      summary: List evidence scores for project
      description: Returns Evidence Score v5 for all entities in the project, sorted by score ascending so low-confidence entities are surfaced first.
      x-engine: Evidence Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: entity_type
          in: query
          schema:
            type: string
          description: Filter scores by entity type
        - name: min_score
          in: query
          schema:
            type: number
            format: float
          description: Filter entities with score at or above this threshold
        - name: max_score
          in: query
          schema:
            type: number
            format: float
          description: Filter entities with score at or below this threshold
      responses:
        '200':
          description: Evidence scores for all entities in project
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceScore'
                  project_average:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: Average evidence score across all scored entities
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/scores/{entityType}/{entityId}:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
      - name: entityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Evidence Engine]
      operationId: getEvidenceScore
      summary: Get evidence score for entity
      description: |
        Returns the current Evidence Score v5 for a specific entity with full component breakdown.

        Evidence Score v5 formula:
        - Source count component (25%): source_count / 10 × 0.25
        - Recency decay component (25%): exponential decay based on days since last evidence
        - Corroboration ratio component (25%): proportion of claims corroborated by multiple sources
        - Capture diversity component (15%): variety of capture types used
        - Reliability weight average (10%): average reliability weight across approved sources
      x-engine: Evidence Engine
      responses:
        '200':
          description: Evidence score with component breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceScoreDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/search:
    post:
      tags: [Evidence Engine]
      operationId: searchEvidence
      summary: Semantic evidence search
      description: Performs vector-semantic search across all approved evidence using Vertex AI Matching Engine. Returns the most relevant evidence items for the query.
      x-engine: Evidence Engine, AI Orchestration Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: Natural language search query
                entity_type:
                  type: string
                  enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
                  description: Restrict search to evidence for a specific entity type
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                  description: Maximum number of results to return
                min_similarity:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  default: 0.7
                  description: Minimum semantic similarity threshold
      responses:
        '200':
          description: Semantic search results ranked by relevance
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Evidence'
                        - type: object
                          properties:
                            similarity_score:
                              type: number
                              format: float
                              minimum: 0
                              maximum: 1
                  query_time_ms:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{evidenceId}/chain:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Evidence Engine]
      operationId: getEvidenceChain
      summary: Get evidence audit chain
      description: Returns the complete audit chain for this evidence item including submission, all review events, approval/rejection, and any downstream score recalculations.
      x-engine: Evidence Engine
      responses:
        '200':
          description: Complete evidence audit chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidence_id:
                    type: string
                    format: uuid
                  chain:
                    type: array
                    items:
                      type: object
                      properties:
                        event_type:
                          type: string
                          enum: [submitted, reviewed, approved, rejected, score_recalculated, superseded]
                        occurred_at:
                          type: string
                          format: date-time
                        actor_id:
                          type: string
                          format: uuid
                        actor_name:
                          type: string
                        details:
                          type: object
                          additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Project Intelligence Graph
  # ---------------------------------------------------------------------------

  /graph/entities:
    get:
      tags: [Project Intelligence Graph]
      operationId: listGraphEntities
      summary: List PIG entity nodes
      description: Returns a paginated list of entity nodes in the Project Intelligence Graph. Supports filtering by entity type and text search across entity attributes.
      x-engine: Impact Analysis Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [Activity, Milestone, Drawing, Document, Equipment, Vendor, Dispatch, Evidence, Change, Decision, Risk, Issue, Gate, WBS, Package, Shipment, Claim, Payment, Inspection, CommissioningItem, OrganizationalUnit, Person]
          description: Filter by PIG node type (case-sensitive)
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search across node attributes
      responses:
        '200':
          description: Paginated list of graph entity nodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/GraphNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /graph/entities/{entityType}/{entityId}:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [Activity, Milestone, Drawing, Document, Equipment, Vendor, Dispatch, Evidence, Change, Decision, Risk, Issue, Gate, WBS, Package, Shipment, Claim, Payment, Inspection, CommissioningItem, OrganizationalUnit, Person]
        description: PIG node type
      - name: entityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Entity identifier
    get:
      tags: [Project Intelligence Graph]
      operationId: getGraphEntity
      summary: Get entity node with all connections
      description: Returns the full PIG node for an entity including all inbound and outbound edges with weights and metadata. This is the canonical view of an entity's relationships.
      x-engine: Impact Analysis Engine
      responses:
        '200':
          description: Graph entity node with all connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphNodeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /graph/entities/{entityType}/{entityId}/connections:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
      - name: entityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Project Intelligence Graph]
      operationId: getEntityConnections
      summary: Get entity connections (edges)
      description: Returns all inbound and outbound edges for this entity node with edge types, weights, and target node summaries.
      x-engine: Impact Analysis Engine
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum: [in, out, both]
            default: both
          description: Edge direction to return
        - name: edge_type
          in: query
          schema:
            type: string
            enum: [BLOCKS, SUPPLIES_TO, APPROVED_BY, IMPACTS, DEPENDS_ON, SUPERSEDES, CONFLICTS_WITH, DELIVERS_FOR, REVIEWS, ASSIGNED_TO, COORDINATES_WITH, ESCALATES_TO, PRECEDED_BY, PARALLEL_WITH, REQUIRES, SATISFIES, VERIFIES, CLOSES, MONITORS, TRIGGERS, OWNS, RAISED_BY, RESOLVED_BY, REFERENCES, SUPERSEDED_BY, MITIGATES, RAISES_RISK_TO, CLEARS, GATES, REPORTS_TO]
          description: Filter by edge type
        - name: min_weight
          in: query
          schema:
            type: number
            format: float
          description: Filter edges with weight at or above this value
      responses:
        '200':
          description: All edges (in and out) with weights
          content:
            application/json:
              schema:
                type: object
                properties:
                  inbound:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphEdge'
                  outbound:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphEdge'
                  total_connections:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /graph/queries:
    post:
      tags: [Project Intelligence Graph]
      operationId: graphTraversalQuery
      summary: Graph traversal query
      description: |
        Executes a graph traversal query from a start entity. The traversal follows edges of
        specified types up to a maximum depth. Used by the Impact Analysis Engine for cascade
        impact computation and by the Dependency & Chain Analysis Engine for critical path analysis.
      x-engine: Impact Analysis Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Graph traversal results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /graph/paths:
    get:
      tags: [Project Intelligence Graph]
      operationId: getGraphPath
      summary: Shortest path between two entities
      description: Finds the shortest path between two entities in the PIG using Dijkstra's algorithm weighted by edge weights.
      x-engine: Impact Analysis Engine
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Source entity in format `{entityType}/{entityId}` e.g. `Activity/uuid`
        - name: to
          in: query
          required: true
          schema:
            type: string
          description: Target entity in format `{entityType}/{entityId}`
        - name: edge_types
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated list of edge types to traverse (all types if omitted)
      responses:
        '200':
          description: Shortest path between entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  path_found:
                    type: boolean
                  path:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphNode'
                  edges:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphEdge'
                  total_weight:
                    type: number
                    format: float
                  hop_count:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /graph/stats:
    get:
      tags: [Project Intelligence Graph]
      operationId: getGraphStats
      summary: Graph statistics
      description: Returns aggregate statistics for the project's PIG including node counts by type, edge counts by type, and graph density.
      x-engine: Impact Analysis Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Graph statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  node_count_by_type:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Count of nodes for each entity type
                  edge_count_by_type:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Count of edges for each edge type
                  total_nodes:
                    type: integer
                  total_edges:
                    type: integer
                  graph_density:
                    type: number
                    format: float
                    description: Graph density (edges / possible edges)
                  computed_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Drawings & Documents
  # ---------------------------------------------------------------------------

  /drawings:
    get:
      tags: [Drawings & Documents]
      operationId: listDrawings
      summary: List drawings
      description: Returns a paginated list of drawings with current revision status and consistency alerts.
      x-engine: Synchronization & Consistency Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: discipline
          in: query
          schema:
            type: string
            enum: [Civil, Structural, Mechanical, Electrical, Instrumentation, Piping, HVAC, Fire, Architecture]
          description: Filter by engineering discipline
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, under_review, issued_for_review, issued_for_construction, superseded, void]
          description: Filter by drawing status
        - name: current_revision
          in: query
          schema:
            type: string
          description: Filter by current revision code (e.g. A, B, C, IFC)
        - name: has_open_rfi
          in: query
          schema:
            type: boolean
          description: Filter to drawings with open RFIs
      responses:
        '200':
          description: Paginated list of drawings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DrawingSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Drawings & Documents]
      operationId: createDrawing
      summary: Create drawing
      description: Creates a new drawing record in the drawing register. Initial revision is created automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDrawingRequest'
      responses:
        '201':
          description: Drawing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /drawings/{drawingId}:
    parameters:
      - name: drawingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Drawings & Documents]
      operationId: getDrawing
      summary: Get drawing detail
      description: Returns full drawing detail with current revision metadata, open RFI count, and consistency status.
      x-engine: Synchronization & Consistency Engine
      responses:
        '200':
          description: Drawing detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Drawings & Documents]
      operationId: updateDrawing
      summary: Update drawing metadata
      description: Updates drawing metadata (title, discipline, originator). To update the drawing content, issue a new revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDrawingRequest'
      responses:
        '200':
          description: Updated drawing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /drawings/{drawingId}/revisions:
    parameters:
      - name: drawingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Drawings & Documents]
      operationId: listDrawingRevisions
      summary: List drawing revisions
      description: Returns all revisions for this drawing in chronological order with signed download URLs.
      x-engine: Synchronization & Consistency Engine
      responses:
        '200':
          description: Drawing revision history
          content:
            application/json:
              schema:
                type: object
                properties:
                  drawing_id:
                    type: string
                    format: uuid
                  current_revision_id:
                    type: string
                    format: uuid
                  revisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DrawingRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Drawings & Documents]
      operationId: issueDrawingRevision
      summary: Issue new revision
      description: Issues a new revision of this drawing. Previous revision is superseded. Consistency Engine checks for conflicts with linked entities.
      x-engine: Synchronization & Consistency Engine
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [revision_code, status, issued_at]
              properties:
                revision_code:
                  type: string
                  example: C
                  description: Revision identifier (e.g. A, B, C, IFC-01)
                status:
                  type: string
                  enum: [draft, under_review, issued_for_review, issued_for_construction]
                issued_at:
                  type: string
                  format: date
                  description: Issue date
                change_description:
                  type: string
                  maxLength: 500
                  description: Description of changes from previous revision
                file:
                  type: string
                  format: binary
                  description: Drawing file (PDF or DWG)
      responses:
        '201':
          description: New revision issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawingRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /drawings/{drawingId}/rfis:
    parameters:
      - name: drawingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Drawings & Documents]
      operationId: listDrawingRFIs
      summary: List RFIs for drawing
      description: Returns all RFIs raised against this drawing.
      responses:
        '200':
          description: RFI list for this drawing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RFI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Drawings & Documents]
      operationId: raiseRFI
      summary: Raise RFI
      description: Raises a Request for Information against this drawing. Automatically linked to vendor if drawing was produced by vendor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRFIRequest'
      responses:
        '201':
          description: RFI raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /drawings/{drawingId}/rfis/{rfiId}:
    parameters:
      - name: drawingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: rfiId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Drawings & Documents]
      operationId: updateRFI
      summary: Update/respond to RFI
      description: Updates an RFI status or submits a response. Closing an RFI triggers Vendor Intelligence Engine to update the responsiveness dimension score.
      x-engine: Vendor Intelligence Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRFIRequest'
      responses:
        '200':
          description: RFI updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /documents:
    get:
      tags: [Drawings & Documents]
      operationId: listDocuments
      summary: List documents
      description: Returns a paginated list of project documents excluding drawings (for drawings use /drawings).
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: document_type
          in: query
          schema:
            type: string
            enum: [specification, procedure, method_statement, inspection_test_plan, commissioning_plan, handover_document, contract, correspondence, report, other]
          description: Filter by document type
      responses:
        '200':
          description: Paginated document list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Drawings & Documents]
      operationId: uploadDocument
      summary: Upload document
      description: Uploads a new project document. Accepted formats are PDF, DOCX, XLSX, and PPTX. Maximum file size is 100MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, document_type, file]
              properties:
                title:
                  type: string
                  maxLength: 200
                document_type:
                  type: string
                  enum: [specification, procedure, method_statement, inspection_test_plan, commissioning_plan, handover_document, contract, correspondence, report, other]
                description:
                  type: string
                  maxLength: 1000
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Change Intelligence
  # ---------------------------------------------------------------------------

  /changes:
    get:
      tags: [Change Intelligence]
      operationId: listChanges
      summary: List changes
      description: Returns a paginated list of change requests with impact summary. Supports filtering by status, type, and requestor.
      x-engine: Impact Analysis Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, impact_assessment, under_review, approved, rejected, implemented, voided]
        - name: type
          in: query
          schema:
            type: string
            enum: [scope_change, technical_deviation, vendor_change, schedule_change, cost_change, regulatory_change, other]
        - name: requestor_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by the user who raised the change
        - name: has_cost_impact
          in: query
          schema:
            type: boolean
          description: Filter to changes with a non-zero cost impact
      responses:
        '200':
          description: Paginated list of changes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChangeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Change Intelligence]
      operationId: initiateChange
      summary: Initiate change
      description: Creates a new change request. Status is 'draft'. Impact Analysis Engine is invoked asynchronously upon submission.
      x-engine: Impact Analysis Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChangeRequest'
      responses:
        '201':
          description: Change created in draft state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Change Intelligence]
      operationId: getChange
      summary: Get change detail
      description: Returns full change detail including impact assessment summary, approval chain status, and linked coordination items.
      x-engine: Impact Analysis Engine
      responses:
        '200':
          description: Change detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Change Intelligence]
      operationId: updateChange
      summary: Update change
      description: Updates change description and metadata. Only allowed while in draft or under_review status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChangeRequest'
      responses:
        '200':
          description: Updated change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Change is in a non-editable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}/impact:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Change Intelligence]
      operationId: getChangeImpact
      summary: Get impact assessment
      description: Returns the detailed impact assessment computed by the Impact Analysis Engine. Includes affected activities, drawings, equipment, cost delta, schedule delta, and quality/safety dimensions.
      x-engine: Impact Analysis Engine
      responses:
        '200':
          description: Impact assessment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeImpact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Change Intelligence]
      operationId: triggerImpactAssessment
      summary: Trigger impact assessment
      description: Manually triggers the Impact Analysis Engine to re-run impact assessment. Returns the job ID for polling.
      x-engine: Impact Analysis Engine
      responses:
        '201':
          description: Impact assessment triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [queued, running, completed, failed]
                  estimated_seconds:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}/approvals:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Change Intelligence]
      operationId: getChangeApprovals
      summary: Get approval chain status
      description: Returns the full approval chain for this change with each approver's status and timestamp.
      responses:
        '200':
          description: Approval chain status
          content:
            application/json:
              schema:
                type: object
                properties:
                  change_id:
                    type: string
                    format: uuid
                  chain:
                    type: array
                    items:
                      type: object
                      properties:
                        step:
                          type: integer
                        approver_id:
                          type: string
                          format: uuid
                        approver_name:
                          type: string
                        role:
                          type: string
                        status:
                          type: string
                          enum: [pending, approved, rejected, delegated]
                        actioned_at:
                          type: string
                          format: date-time
                        notes:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}/approve:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Change Intelligence]
      operationId: approveChange
      summary: Approve change
      description: Approves this change at the authenticated user's approval step. If this is the final approval, change status moves to 'approved' and Coordination Engine generates implementation items.
      x-engine: Coordination Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Change approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Change is not in a state awaiting this user's approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}/reject:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Change Intelligence]
      operationId: rejectChange
      summary: Reject change
      description: Rejects this change with a mandatory reason. Rejected changes are logged to Organizational Memory Engine for pattern analysis.
      x-engine: Organizational Memory Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Change rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Change'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /changes/{changeId}/coordination:
    parameters:
      - name: changeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Change Intelligence]
      operationId: getChangeCoordination
      summary: Get coordination items from change
      description: Returns all coordination items generated from this change's impact assessment.
      x-engine: Coordination Engine
      responses:
