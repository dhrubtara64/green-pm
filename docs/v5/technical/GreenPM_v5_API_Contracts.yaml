      responses:
        '200':
          description: Coordination analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinationAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Tag: Organizational Memory (NEW in v5)
  # ---------------------------------------------------------------------------

  /memory/patterns:
    get:
      tags: [Organizational Memory]
      operationId: listMemoryPatterns
      summary: List institutional patterns
      description: Returns all patterns identified by the Organizational Memory Engine. Patterns are recurring structures with confidence scores based on historical frequency.
      x-engine: Organizational Memory Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - name: pattern_type
          in: query
          schema:
            type: string
            enum: [risk_pattern, vendor_recovery, schedule_recovery, change_outcome, resource_constraint, quality_pattern]
        - name: min_confidence
          in: query
          schema:
            type: number
            format: float
            minimum: 0
            maximum: 1
            default: 0.6
          description: Minimum confidence score
      responses:
        '200':
          description: Institutional patterns list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemoryPattern'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /memory/patterns/{patternId}:
    parameters:
      - name: patternId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Organizational Memory]
      operationId: getMemoryPattern
      summary: Get pattern detail
      description: Returns a pattern with full historical outcomes and recommended actions.
      x-engine: Organizational Memory Engine
      responses:
        '200':
          description: Pattern detail with historical outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryPatternDetail'
        '401':
