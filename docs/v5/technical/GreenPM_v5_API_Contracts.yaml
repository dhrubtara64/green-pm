      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [activity, drawing, equipment, vendor, dispatch, change, decision, risk, milestone, wbs, shipment, package]
        entity_id:
          type: string
          format: uuid
        capture_type:
          type: string
          enum: [photo, video, site_diary, inspection_report, rfi, ncr, drawing_markup, voice_note, weather_log, material_delivery, daily_progress, test_result]
        status:
          type: string
          enum: [pending, under_review, approved, rejected]
        captured_at:
          type: string
          format: date-time
        submitted_by:
          type: string
          format: uuid
        submitted_by_name:
          type: string
        description:
          type: string
        file_name:
          type: string
          nullable: true
        file_size_bytes:
          type: integer
          nullable: true
        mime_type:
          type: string
          nullable: true
