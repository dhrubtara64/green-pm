              format: double
        resource_loading:
          type: object
          additionalProperties:
            type: number
          description: Discipline → headcount for current week
        risk_exposure:
          type: number
          format: double
        readiness_status:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Gate type → completion pct for this WBS scope

    # -------------------------------------------------------------------------
    # Executive Digital Twin Schemas
    # -------------------------------------------------------------------------

    ExecutiveDigitalTwin:
      type: object
      required: [project_id, week_date, overall_health, reality, forecast, required_decisions, generated_at]
      description: |
        The Executive Digital Twin is delivered every Monday morning via the Project Command Centre.
        No charts are shown without narrative context; no KPIs without trend direction.
        Powered by Forecasting Engine, Recommendation Engine, Decision Engine, and Organizational Memory Engine.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        week_date:
          type: string
          format: date
          description: Monday date for this EDT snapshot
        overall_health:
          type: string
          enum: [green, amber, red]
        overall_health_narrative:
          type: string
          description: One-paragraph narrative explaining the health status
        reality:
          $ref: '#/components/schemas/EDTReality'
        forecast:
          $ref: '#/components/schemas/EDTForecast'
        required_decisions:
          $ref: '#/components/schemas/EDTRequiredDecisions'
        generated_at:
          type: string
          format: date-time

    EDTReality:
      type: object
      description: Current state panel — what is happening right now on the project
      properties:
        narrative:
          type: string
          description: AI-generated narrative of current project reality
        schedule_health:
          type: string
          enum: [green, amber, red]
        schedule_summary:
          type: string
          example: "P50 completion tracking 14 days behind baseline"
        budget_health:
          type: string
          enum: [green, amber, red]
        budget_summary:
          type: string
          example: "EAC ₹ 847M vs BAC ₹ 820M (+3.3%)"
        quality_health:
          type: string
          enum: [green, amber, red]
        quality_summary:
          type: string
        supply_chain_health:
          type: string
          enum: [green, amber, red]
        supply_chain_summary:
          type: string
        key_events_this_week:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              significance:
                type: string
                enum: [positive, neutral, negative]
              entity_type:
                type: string
                nullable: true
              entity_id:
                type: string
                format: uuid
                nullable: true
        top_risks:
          type: array
          items:
            $ref: '#/components/schemas/RiskSummary'
          maxItems: 5

    EDTForecast:
      type: object
      description: Forward-looking panel — where the project is heading
      properties:
        narrative:
          type: string
          description: AI-generated narrative of project trajectory
        completion_trend:
          type: string
          enum: [improving, stable, deteriorating]
        p50_completion:
          type: string
          format: date
        p80_completion:
          type: string
          format: date
        eac:
          type: number
          format: double
          description: Estimate at Completion
        eac_currency:
          type: string
        cost_variance:
          type: number
          format: double
        schedule_variance_days:
          type: integer
        readiness_summary:
          type: object
          description: Gate type → completion pct
          additionalProperties:
            type: number
            format: float
        lookahead_14_days:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              due_date:
                type: string
                format: date
              type:
                type: string
                enum: [milestone, decision_deadline, inspection, delivery, permit]
        domain_forecasts:
          type: array
          items:
            $ref: '#/components/schemas/ForecastDomain'

    EDTRequiredDecisions:
      type: object
      description: Action panel — what the executive must decide this week
      properties:
        narrative:
          type: string
          description: AI-generated narrative of decisions requiring executive attention
        decision_count:
          type: integer
        decisions:
          type: array
          items:
            type: object
            properties:
              decision_id:
                type: string
                format: uuid
              title:
                type: string
              required_by:
                type: string
                format: date
              consequence_of_delay:
                type: string
                description: What happens if this decision is not made this week
              options_summary:
                type: string
          maxItems: 5
          description: Top 5 decisions requiring executive action
        top_recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
          maxItems: 5

    # -------------------------------------------------------------------------
    # Green PM Studio Schemas
    # -------------------------------------------------------------------------

    StudioTemplate:
      type: object
      required: [id, project_id, name, builder_type, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
          example: Monsoon Season Evidence Criteria
        description:
          type: string
          nullable: true
        builder_type:
          type: string
          enum: [evidence_criteria, readiness_gate, simulation_scenario, risk_template, coordination_rule, report_template, dashboard_view, alert_rule, scoring_weight, workflow_gate, vendor_scorecard, wbs_template, dispatch_lifecycle, notification_rule, integration_mapping]
        configuration:
          type: object
          additionalProperties: true
          description: Template configuration object validated against the builder schema
        is_validated:
          type: boolean
          default: false
        version:
          type: integer
          description: Increments on each update
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        last_applied_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStudioTemplateRequest:
      type: object
      required: [project_id, name, builder_type, configuration]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        builder_type:
          type: string
          enum: [evidence_criteria, readiness_gate, simulation_scenario, risk_template, coordination_rule, report_template, dashboard_view, alert_rule, scoring_weight, workflow_gate, vendor_scorecard, wbs_template, dispatch_lifecycle, notification_rule, integration_mapping]
        configuration:
          type: object
          additionalProperties: true
          description: Template configuration. Must validate against the builder schema.

    UpdateStudioTemplateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        configuration:
          type: object
          additionalProperties: true
