  # ---------------------------------------------------------------------------

  /forecasts:
    get:
      tags: [Forecasting Engine]
      operationId: listForecasts
      summary: Get all 6 domain forecasts summary
      description: Returns a summary of all six domain forecasts (schedule, budget, quality, resource, commissioning, cash flow) with confidence levels and trend direction.
      x-engine: Forecasting Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: All 6 domain forecast summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                    format: uuid
                  computed_at:
                    type: string
                    format: date-time
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/ForecastDomain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /forecasts/schedule:
    get:
      tags: [Forecasting Engine]
      operationId: getScheduleForecast
      summary: Schedule forecast with confidence intervals
      description: Returns the schedule forecast with p50, p80, and p90 completion dates, confidence intervals, and key driver activities.
      x-engine: Forecasting Engine, Dependency & Chain Analysis Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Schedule forecast
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Forecast'
                  - type: object
                    properties:
                      forecast_type:
                        type: string
                        enum: [schedule]
                      baseline_completion:
                        type: string
                        format: date
                      p50_completion:
                        type: string
                        format: date
                      p80_completion:
                        type: string
                        format: date
                      p90_completion:
                        type: string
                        format: date
                      float_remaining_days:
                        type: integer
                      critical_activities:
                        type: array
                        items:
                          type: object
                          properties:
                            activity_id:
                              type: string
                              format: uuid
                            activity_name:
                              type: string
                            delay_risk_days:
                              type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /forecasts/budget:
    get:
      tags: [Forecasting Engine]
      operationId: getBudgetForecast
      summary: Budget forecast with S-curve data
      description: Returns the budget forecast with EAC (Estimate at Completion), S-curve data points, and variance analysis by WBS.
      x-engine: Forecasting Engine
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Budget forecast with S-curve
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Forecast'
                  - type: object
                    properties:
                      forecast_type:
                        type: string
                        enum: [budget]
                      budget_at_completion:
                        type: number
                        format: double
                        description: Original budget (BAC)
                      estimate_at_completion:
                        type: number
                        format: double
                        description: Forecast final cost (EAC)
                      estimate_to_complete:
                        type: number
                        format: double
                        description: Remaining cost forecast (ETC)
                      cost_variance:
                        type: number
                        format: double
                        description: CV = EV - AC
                      s_curve:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            planned_value:
                              type: number
                              format: double
                            earned_value:
                              type: number
                              format: double
                            actual_cost:
                              type: number
                              format: double
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /forecasts/quality:
    get:
