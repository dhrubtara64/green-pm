  /dispatches/{dispatchId}/stage:
    parameters:
      - name: dispatchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Supply Chain]
      operationId: advanceDispatchStage
      summary: Advance dispatch to next stage
      description: Advances the dispatch to the next lifecycle stage. Each stage transition can optionally link an evidence item and notes.
      x-engine: Supply Chain Intelligence Engine, Vendor Intelligence Engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [po_issued, fabrication, inspection_scheduled, fat_complete, packing, shipping, customs_clearance, delivery, acceptance, closed]
                  description: Target stage (must be the next stage in sequence)
                notes:
                  type: string
                  maxLength: 500
                evidence_id:
                  type: string
                  format: uuid
                  description: Optional evidence item to attach to this stage transition
                actual_date:
                  type: string
                  format: date
                  description: Actual date this stage was achieved (defaults to today)
      responses:
        '200':
          description: Dispatch stage advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stage transition not allowed (wrong sequence or dispatch not active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

