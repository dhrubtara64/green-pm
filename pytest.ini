[pytest]
asyncio_mode = auto
testpaths = tests
addopts = --import-mode=importlib
markers =
    unit: unit tests — no external dependencies, run anywhere
    integration: integration tests — require real PostgreSQL and Redis
    rls: RLS isolation tests — required to pass before every PR merge
    load: load tests — k6-based, not run in standard CI
filterwarnings =
    ignore::DeprecationWarning
