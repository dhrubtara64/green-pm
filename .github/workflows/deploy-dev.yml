name: Deploy to Dev (green-pm-sandbox)

on:
  push:
    branches: [dev]

env:
  GCP_PROJECT_ID: green-pm-sandbox
  GCP_REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/green-pm-sandbox/cloud-run-source-deploy

# Prerequisites (set these in GitHub repo Settings → Secrets and variables → Actions):
#   GCP_SA_KEY  — Service account JSON key with roles:
#                   roles/run.developer
#                   roles/artifactregistry.writer
#                   roles/iam.serviceAccountUser
#   To create: gcloud iam service-accounts keys create key.json \
#               --iam-account=729630816551-compute@developer.gserviceaccount.com \
#               --project=green-pm-sandbox
#   Then: cat key.json | base64 → paste as GCP_SA_KEY secret

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            core-platform:
              - 'services/core-platform/**'
            pig-service:
              - 'services/pig-service/**'
            outbox-worker:
              - 'services/outbox-worker/**'
            activity-workspace:
              - 'services/activity-workspace/**'

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: changes
    # Only deploy when GCP_SA_KEY secret is configured
    if: ${{ secrets.GCP_SA_KEY != '' }}
    strategy:
      matrix:
        service:
          - api-gateway
          - core-platform
          - pig-service
          - outbox-worker
          - activity-workspace
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Check if service has Dockerfile
        id: check
        run: |
          if [ -f "services/${{ matrix.service }}/Dockerfile" ]; then
            echo "has_dockerfile=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerfile=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile yet for ${{ matrix.service }} — skipping deploy"
          fi

      - name: Build and push image
        if: steps.check.outputs.has_dockerfile == 'true'
        run: |
          IMAGE=${{ env.REGISTRY }}/greenpm-${{ matrix.service }}:${{ github.sha }}
          docker build \
            -t $IMAGE \
            -t ${{ env.REGISTRY }}/greenpm-${{ matrix.service }}:dev-latest \
            services/${{ matrix.service }}/
          docker push $IMAGE
          docker push ${{ env.REGISTRY }}/greenpm-${{ matrix.service }}:dev-latest

      - name: Deploy to Cloud Run (dev)
        if: steps.check.outputs.has_dockerfile == 'true'
        run: |
          gcloud run deploy greenpm-dev-${{ matrix.service }} \
            --image ${{ env.REGISTRY }}/greenpm-${{ matrix.service }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars ENVIRONMENT=dev \
            --service-account 729630816551-compute@developer.gserviceaccount.com \
            --quiet

  notify:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project: green-pm-sandbox" >> $GITHUB_STEP_SUMMARY
          echo "- Region: asia-south1" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
