version: '3.9'

# Green PM v5 — Local Development Environment
# Usage:
#   make dev        → start infrastructure (postgres, redis, pubsub, pgbouncer)
#   make migrate    → apply Alembic migrations
#   make seed       → seed demo data
#   make test       → run full test suite
#
# v1 legacy services are still available with: docker compose --profile v1 up

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: greenpm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: greenpm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenpm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=green-pm-sandbox
    ports:
      - "8085:8085"

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: greenpm
      DATABASES_USER: greenpm
      DATABASES_PASSWORD: ${DB_PASSWORD:-devpassword}
      PGBOUNCER_POOL_MODE: session
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - "5433:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── v5 Services (uncomment as each is implemented in Phase 0) ───────────

  # api-gateway:
  #   build: services/api-gateway
  #   ports: ["8000:8000"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://greenpm:${DB_PASSWORD:-devpassword}@pgbouncer:5432/greenpm
  #     REDIS_URL: redis://redis:6379
  #     PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
  #     ENVIRONMENT: development

  # core-platform:
  #   build: services/core-platform
  #   ports: ["8001:8000"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://greenpm:${DB_PASSWORD:-devpassword}@pgbouncer:5432/greenpm
  #     REDIS_URL: redis://redis:6379
  #     ENVIRONMENT: development

  # pig-service:
  #   build: services/pig-service
  #   ports: ["8002:8000"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://greenpm:${DB_PASSWORD:-devpassword}@pgbouncer:5432/greenpm
  #     ENVIRONMENT: development

  # outbox-worker:
  #   build: services/outbox-worker
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://greenpm:${DB_PASSWORD:-devpassword}@pgbouncer:5432/greenpm
  #     PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
  #     GCP_PROJECT_ID: green-pm-sandbox
  #     ENVIRONMENT: development

  # activity-workspace:
  #   build: services/activity-workspace
  #   ports: ["8003:8000"]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://greenpm:${DB_PASSWORD:-devpassword}@pgbouncer:5432/greenpm
  #     PIG_SERVICE_URL: http://pig-service:8000
  #     ENVIRONMENT: development

  # ─── v1 Legacy (preserved, run with --profile v1) ────────────────────────

  v1-backend:
    build: backend
    ports: ["8080:8080"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [v1]

  v1-frontend:
    build: frontend
    ports: ["3000:3000"]
    env_file: .env
    profiles: [v1]

volumes:
  postgres_data:
